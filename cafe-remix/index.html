<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cafe Menu</title>
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <div class="menu">
      <main>
        <h1>BURGER SHOP</h1>
        <p class="established">Est. 2020</p>
        <hr>
        <section>
          <h2>Drinks</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon"/>
          <article class="item">
            <p class="flavor">Soda</p><p class="price">2.00</p>
          </article>
          <article class="item">
            <p class="flavor">Coffee</p><p class="price">2.50</p>
          </article>
          <article class="item">
            <p class="flavor">Orange Juice</p><p class="price">2.75</p>
          </article>
          <article class="item">
            <p class="flavor">Milkshake</p><p class="price">3.00</p>
          </article>
          <!-- <article class="item">
            <p class="flavor">Mocha</p><p class="price">4.50</p>
          </article> -->
        </section>
        <section>
          <h2>Burgers</h2>
          <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon"/>
          <article class="item">
            <p class="dessert">Cheeseburger</p><p class="price">4.50</p>
          </article>
          <article class="item">
            <p class="dessert">Double Patty</p><p class="price">5.75</p>
          </article>
          <article class="item">
            <p class="dessert">All-Star</p><p class="price">5.50</p>
          </article>
          <article class="item">
            <p class="dessert">Chicken Sandwich</p><p class="price">4.75</p>
          </article>
        </section>
      </main>
      <hr class="bottom-line">
      <footer>
        <address>
          <p>
            <a href="https://www.freecodecamp.org" target="_blank">Visit our website</a>
          </p>
          <p class="address">123 Free Code Camp Drive</p>
        </address>
      </footer>
    </div>
  </body>
</html>
